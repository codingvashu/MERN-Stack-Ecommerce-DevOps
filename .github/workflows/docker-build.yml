
name: Docker Build CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ecommerce-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile -t ecommerce-frontend:ci .

